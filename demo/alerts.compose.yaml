name: observatory-alert-demo
services:
  api:
    image: alpine:latest
    command: [sh, -c, 'touch /tmp/healthy; echo alert-demo-ready; sleep 900']
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/healthy']
      interval: 2s
      timeout: 1s
      retries: 1
    mem_limit: 32m
    cpus: 0.25
  brief:
    image: alpine:latest
    profiles: [manual]
    command: [sh, -c, 'echo deliberate-alert-demo-exit; exit 7']
    mem_limit: 32m
    cpus: 0.1
