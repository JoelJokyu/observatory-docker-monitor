name: observatory-event-demo
services:
  api:
    image: alpine:latest
    command: [sh, -c, 'touch /tmp/healthy; echo event-demo-ready; sleep 120']
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/healthy']
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 1s
    mem_limit: 32m
    cpus: 0.1
  brief:
    image: alpine:latest
    command: [sh, -c, 'echo intentional-test-exit; exit 3']
    mem_limit: 32m
    cpus: 0.1
