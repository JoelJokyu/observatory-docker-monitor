name: observatory-session-demo
services:
  api:
    image: alpine:latest
    command: [sh, -c, 'echo session-demo-ready; sleep 600']
    healthcheck:
      test: [CMD-SHELL, 'true']
      interval: 2s
      timeout: 1s
      retries: 1
    mem_limit: 32m
    cpus: 0.25
  brief:
    image: alpine:latest
    profiles: [manual]
    command: [sh, -c, 'echo intentional-short-lived-session-worker; exit 7']
    mem_limit: 32m
    cpus: 0.1
